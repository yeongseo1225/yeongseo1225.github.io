name: Normalize posts

# Obsidian-published notes use tab-indented lists, <font>/<mark> tags and no blank
# lines around headings, which kramdown (GitHub Pages) silently drops or mangles.
# Normalize them automatically whenever posts change on main.
on:
  push:
    branches: [main]
    paths: ['_posts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/normalize_posts.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain _posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts
            git commit -m "chore: normalize post markdown for kramdown"
            git push
          fi
