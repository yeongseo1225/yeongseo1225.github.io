title: My Blog
description:
theme: minima

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      
header_pages:
  - index.md
  - categories.html
  - tags.html
  - search.html

markdown: kramdown

kramdown:
  input: GFM
  math_engine: null

plugins:
  - jekyll-sitemap

timezone: Asia/Seoul
