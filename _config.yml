title: My Blog
description:
theme: minima

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      
header_pages:
  - index.md
  - categories.html
  - tags.html
  - search.html

markdown: kramdown

kramdown:
  input: GFM
  parse_block_html: true
  math_engine: null

url: "https://yeongseo1225.github.io"
baseurl: ""

plugins:
  - jekyll-sitemap

timezone: Asia/Seoul
