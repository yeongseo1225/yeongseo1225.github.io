---
layout: default
---

<div class="post-page-layout">
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title | escape }}</h1>
      <div class="post-card-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          <svg class="meta-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M16 3v4M8 3v4M3 10h18"></path>
          </svg>
          {{ page.date | date: "%b %-d, %Y" }}
        </time>

        {% if page.categories.size > 0 %}
        <span class="post-card-categories">
          <svg class="meta-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <path d="M3 10h18"></path>
          </svg>
          {{ page.categories | join: ", " }}
        </span>
        {% endif %}
      </div>
      {% if page.tags.size > 0 %}
      <p>
        {% for tag in page.tags %}
        <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a>
        {% endfor %}
      </p>
      {% endif %}
    </header>

    <div class="post-content">{{ content }}</div>
  </article>

  <aside class="post-toc" id="post-toc" aria-label="글 목차" hidden>
    <h2>목차</h2>
    <nav aria-label="본문 소제목">
      <ul id="post-toc-list"></ul>
    </nav>
  </aside>
</div>
<script
  src="{{ '/assets/js/youtube-thumbnails.js' | relative_url }}"
  defer
></script>
<script src="{{ '/assets/js/post-toc.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/post-format.js' | relative_url }}" defer></script>
